[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arev"
version = "0.1.0"
description = "Location-based solar site assessment: sunlight, losses, farming impact and payback from coordinates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "requests",
    "scikit-learn",
    "tqdm",
    "pystac-client",
    "planetary-computer",
    "rasterio",
]

[tool.setuptools]
packages = ["arev"]
